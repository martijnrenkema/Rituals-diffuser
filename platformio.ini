; PlatformIO Project Configuration File
; Rituals Perfume Genie 2.0 - Custom Firmware
;
; Platform and library versions are pinned exactly so every build (and every
; release binary) is reproducible. Bump them deliberately and re-test.

[env:esp8266]
platform = espressif8266@4.2.1
board = esp_wroom_02
framework = arduino

; Libraries
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/ESPAsyncTCP@1.2.2
    makuna/NeoPixelBus@2.8.4
    miguelbalboa/MFRC522@1.4.12

; LittleFS for web files (more efficient than SPIFFS)
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.2m128.ld

; Serial monitor
monitor_speed = 115200

; Upload settings - Serial (eerste keer)
upload_speed = 115200
; upload_port = /dev/cu.usbserial-0001

; ArduinoOTA disabled - use web-based Safe Update instead
lib_ignore = ArduinoOTA

; Build flags
; Optional RAM savers for ESP8266 (add to build_flags):
;   -DESP8266_LITE=1   disables NFC + scent lookup
;   -DENABLE_NFC=0     disables RC522 RFID reader only
;   -DENABLE_SCENT=0   keeps NFC, drops scent name table
build_flags =
    -DCORE_DEBUG_LEVEL=0

; OTA environment (na eerste flash)
[env:esp8266_ota]
platform = espressif8266@4.2.1
board = esp_wroom_02
framework = arduino

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/ESPAsyncTCP@1.2.2
    makuna/NeoPixelBus@2.8.4
    miguelbalboa/MFRC522@1.4.12

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.2m128.ld
monitor_speed = 115200
lib_ignore = ArduinoOTA

upload_protocol = espota
upload_port = rituals-diffuser.local
upload_flags =
    --auth=diffuser-ota

build_flags =
    -DCORE_DEBUG_LEVEL=0

; ===========================================
; ESP32 Environment (voor als ESP8266 kapot is)
; ===========================================
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
    fastled/FastLED@3.10.3
    miguelbalboa/MFRC522@1.4.12

; SPIFFS for web files
board_build.filesystem = spiffs
; Use min_spiffs partition: 1.9MB app, 190KB SPIFFS (default is 1.3MB app)
board_build.partitions = min_spiffs.csv

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ESP32 OTA environment
[env:esp32_ota]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
    fastled/FastLED@3.10.3
    miguelbalboa/MFRC522@1.4.12

board_build.filesystem = spiffs
; Use min_spiffs partition: 1.9MB app, 190KB SPIFFS
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

upload_protocol = espota
upload_port = rituals-diffuser.local
upload_flags =
    --auth=diffuser-ota

build_flags =
    -DCORE_DEBUG_LEVEL=0

; ===========================================
; ESP32-C3 SuperMini Environment
; ===========================================
[env:esp32c3_supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
    fastled/FastLED@3.10.3
    miguelbalboa/MFRC522@1.4.12

; SPIFFS for web files
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32C3_SUPERMINI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ===========================================
; ESP32-C3 SuperMini RC522 TEST Environment
; ===========================================
[env:esp32c3_rfid_test]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; Only compile the RC522 test file
src_filter = +<rc522_test.cpp>

lib_deps =
    miguelbalboa/MFRC522@1.4.12

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DESP32C3_SUPERMINI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRC522_TEST_MODE

; ESP32-C3 SuperMini OTA environment
[env:esp32c3_ota]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    me-no-dev/ESPAsyncWebServer@1.2.4
    me-no-dev/AsyncTCP@1.1.1
    fastled/FastLED@3.10.3
    miguelbalboa/MFRC522@1.4.12

board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

upload_protocol = espota
upload_port = rituals-diffuser.local
upload_flags =
    --auth=diffuser-ota

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32C3_SUPERMINI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
